name: Sync Cards Database

on:
  schedule:
    # Run every Sunday at midnight (00:00 UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run card synchronizer
        run: npm run sync-cards

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cards.json src/data/packs.json
          
          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update cards database [skip ci]"
            git push
            echo "Changes pushed successfully!"
          else
            echo "No database changes found. Skipping commit."
          fi
